<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ML Dataset Profiler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>ML Dataset Profiler</h1>
    <button id="open-file-btn">Open File…</button>
    <span id="file-path"></span>
    <span id="loading-indicator" class="hidden" aria-live="polite">
      <span class="spinner"></span>
      <span id="loading-message">Loading…</span>
    </span>
  </header>

  <section id="error-banner" class="hidden"></section>

  <section id="summary" class="panel hidden">
    <div><strong>Rows:</strong> <span id="row-count"></span></div>
    <div><strong>File size:</strong> <span id="file-size"></span></div>
  </section>

  <section id="schema-section" class="panel hidden">
    <h2>Schema</h2>
    <table id="schema-table">
      <thead>
        <tr><th>Column</th><th>Type</th><th>Null count</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="preview-section" class="panel hidden">
    <h2>Preview (first 50 rows)</h2>
    <div id="preview-wrapper">
      <table id="preview-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="charts-section" class="panel hidden">
    <h2>Charts</h2>

    <div class="chart-subsection" id="null-heatmap-section">
      <h3>Missing-value heatmap</h3>
      <p id="null-heatmap-note" class="chart-note"></p>
      <div id="null-heatmap-chart" class="chart-plot"></div>
    </div>

    <div class="chart-subsection" id="numeric-histograms-section">
      <h3>Numeric distributions</h3>
      <div id="numeric-histograms" class="chart-grid"></div>
    </div>

    <div class="chart-subsection" id="categorical-bars-section">
      <h3>Class balance</h3>
      <div id="categorical-bars" class="chart-grid"></div>
    </div>

    <div class="chart-subsection" id="text-length-histograms-section">
      <h3>Text length distributions</h3>
      <div id="text-length-histograms" class="chart-grid"></div>
    </div>
  </section>

  <script src="plotly.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
